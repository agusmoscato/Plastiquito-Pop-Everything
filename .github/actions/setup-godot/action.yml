name: setup-godot
description: Mesa (lavapipe), xvfb y ffmpeg; Godot 4.4.1 para Linux en caché; importa el proyecto.
runs:
  using: composite
  steps:
    - name: Paquetes del sistema
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq mesa-vulkan-drivers xvfb ffmpeg > /dev/null
    - name: Caché de Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: godot
        key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
    - name: Bajar Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p godot
        curl -sSL -o godot/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
        unzip -q godot/g.zip -d godot && rm godot/g.zip
        mv godot/Godot_v${GODOT_VERSION}_linux.x86_64 godot/godot
        chmod +x godot/godot
    - name: Importar el proyecto
      shell: bash
      run: |
        mkdir -p out
        ./godot/godot --headless --path . --import > out/log_import.txt 2>&1 || true
        tail -n 5 out/log_import.txt
